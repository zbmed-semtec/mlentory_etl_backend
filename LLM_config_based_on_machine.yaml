# LLM settings per GPU. scripts/detect_machine_profile.py picks the first profile whose `match` fits
# the detected GPUs (or `default`) and writes its `llm` keys into .env. Every profile must define every key.
#
# image, llm_model, max_model_len, max_num_seqs, tensor_parallel_size: vLLM server settings.
#   Always pin the vLLM image to a version tag, never `latest`.
# enable_prefix_caching: reuse a document's cached prompt across its properties.
# structured_outputs: vLLM enforces a JSON answer (needs vLLM >= 0.12). Off = the model replies in plain text.
# priority_scheduling: finish started documents before starting new ones (vLLM --scheduling-policy priority).
# extra_args: any other vLLM arguments.
#
# Optimizations are opt-in per profile. `default` is the safe fallback: old vLLM, small model, all optimizations off.
profiles:

  "Tesla T4":
    match:
      gpu_name_contains: "T4"
      min_gpu_count: 1
      min_vram_gb_per_gpu: 15
    llm:
      image: "vllm/vllm-openai:v0.32.0"
      llm_model: "Qwen/Qwen2.5-7B-Instruct-AWQ"
      max_model_len: 32768
      max_num_seqs: 600
      tensor_parallel_size: 1
      enable_prefix_caching: true
      structured_outputs: true
      priority_scheduling: false
      extra_args: ""

  "Tesla V100 32GB (2 GPUs)":
    match:
      gpu_name_contains: "V100"
      min_gpu_count: 2
      min_vram_gb_per_gpu: 31
    llm:
      image: "vllm/vllm-openai:v0.8.5"
      llm_model: "Qwen/Qwen2.5-1.5B-Instruct"
      max_model_len: 32768
      max_num_seqs: 600
      tensor_parallel_size: 2
      enable_prefix_caching: false
      structured_outputs: false
      priority_scheduling: false
      extra_args: "--dtype float32"

  "Tesla V100 32GB":
    match:
      gpu_name_contains: "V100"
      min_gpu_count: 1
      min_vram_gb_per_gpu: 31
    llm:
      image: "vllm/vllm-openai:v0.8.5"
      llm_model: "Qwen/Qwen2.5-1.5B-Instruct"
      max_model_len: 32768
      max_num_seqs: 600
      tensor_parallel_size: 1
      enable_prefix_caching: false
      structured_outputs: false
      priority_scheduling: false
      extra_args: "--dtype float32"

  "RTX A6000":
    match:
      gpu_name_contains: "A6000"
      min_gpu_count: 1
      min_vram_gb_per_gpu: 44
    llm:
      image: "vllm/vllm-openai:v0.32.0"
      llm_model: "cyankiwi/gemma-4-31B-it-qat-AWQ-INT4"
      max_model_len: 20480
      max_num_seqs: 600
      tensor_parallel_size: 1
      enable_prefix_caching: true
      structured_outputs: true
      priority_scheduling: true
      extra_args: "--language-model-only"

  "L40S-48C":
    match:
      gpu_name_contains: "L40S"
      min_gpu_count: 1
      min_vram_gb_per_gpu: 44
    llm:
      image: "vllm/vllm-openai:v0.29.0"
      llm_model: "RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic"
      max_model_len: 32768
      max_num_seqs: 600
      tensor_parallel_size: 1
      enable_prefix_caching: true
      structured_outputs: true
      priority_scheduling: false
      extra_args: "--language-model-only --kv-cache-dtype fp8"

default:
  llm:
    image: "vllm/vllm-openai:v0.8.5"
    llm_model: "Qwen/Qwen2.5-1.5B-Instruct"
    max_model_len: 32768
    max_num_seqs: 600
    tensor_parallel_size: 1
    enable_prefix_caching: false
    structured_outputs: false
    priority_scheduling: false
    extra_args: ""
